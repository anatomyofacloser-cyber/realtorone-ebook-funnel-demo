<script>
const PAINS={
ghost:{label:"Silent after viewing",book:"The Ghost Protocol",page:8,img:"pages/ghost-8.jpg",tag:"Page 8 · Lines 4–5",msg:"Buyer loved the viewing… then went silent? 🤐",line:"When a buyer leaves a viewing with more data than direction, their brain defaults to 'I need to think about it.'",boxes:[[.1177,.1919,.8818,.2094],[.1177,.2144,.2327,.2318]],fix:["Don't leave a viewing with more data than direction: help them simplify.","Before the next viewing, ask: “What made you start looking now, specifically?” (p12)","End every viewing with one specific next step. The book: a buyer who leaves with a specific next step is “seven times less likely to disappear” (p11)."]},
reset:{label:"“Let me think about it”",book:"The Dubai Price Reset",page:6,img:"pages/reset-6.jpg",tag:"Page 6",msg:"Client said “let me think about it”… and never came back? 🤔",line:"Never accept \"let me think\" at face value and walk away.",boxes:[[.2332,.4232,.6120,.4403]],fix:["Treat “let me think” as a polite exit, not a real objection.","Say: “Tell me the one specific thing you want to think about, and let's resolve it on this call. Is it the developer, the payment plan, or the unit itself?” (p6)"]},
cold:{label:"“I'm not interested”",book:"Dubai Cold Calling Mastery",page:33,img:"pages/cold-33.jpg",tag:"Page 33",msg:"“I'm not interested”… 5 seconds into your cold call? 📞",line:"\"I totally understand. Most people aren't interested until they understand the specific advantage. Can I ask you one quick question?\"",boxes:[[.27,.431,.946,.46],[.095,.46,.866,.484]],fix:["Don't plead (“just hear me out for two minutes…”).","Use the line above, then ask: “Are you currently renting, or do you own your place?” (p33)"]},

const MINI=[{"pain": "Client says the price is too high", "synonyms": ["too expensive", "price high", "overpriced", "costly", "price objection", "can't afford"], "book": "The Dubai Price Reset & 3-Page Objection Handling Framework", "page": 5, "fix": "Don't defend the price. Use ALCC: acknowledge, lead with a fact they can't dispute, contrast with the cost of waiting, then close with a choice."}, {"pain": "Client says 'let me think about it'", "synonyms": ["let me think", "think about it", "need time", "i'll think", "will get back"], "book": "The Dubai Price Reset & 3-Page Objection Handling Framework", "page": 6, "fix": "'Let me think' is a polite exit. Convert it into one specific question and resolve it on the call."}, {"pain": "Prospect says 'I'm not interested'", "synonyms": ["not interested", "no thanks", "hang up", "rejection", "not looking"], "book": "Dubai Cold Calling Mastery", "page": 33, "fix": "Don't plead. Acknowledge, create curiosity, and ask one quick question about their situation."}, {"pain": "Buyer disappeared after viewing", "synonyms": ["ghosted after viewing", "no reply after viewing", "buyer vanished", "went silent after site visit", "viewing no response"], "book": "The Ghost Protocol: Why Dubai Buyers Disappear After Viewing", "page": 8, "fix": "Ghosting after a viewing has a specific cause, starting with information overload: you gave data, not direction."}, {"pain": "Buyer ghosting me / not replying", "synonyms": ["ghosting", "no reply", "seen no reply", "silent lead", "not responding", "left on read", "blue tick"], "book": "The Follow-Through Playbook", "page": 5, "fix": "Ghosting is an emotional reaction to risk. Close the distance one interaction at a time instead of adding pressure."}, {"pain": "Buyer needs to speak to partner/spouse", "synonyms": ["wife", "husband", "partner", "family decision", "speak to my partner", "check with family"], "book": "The Follow-Through Playbook", "page": 25, "fix": "Arm them with a one-page summary they can share, so they look smart explaining it."}, {"pain": "I'm scared of cold calling", "synonyms": ["fear of calling", "cold call fear", "nervous on calls", "call reluctance", "hate cold calling"], "book": "Dubai Cold Calling Mastery", "page": 5, "fix": "Even the founder's first days were brutal. The fix was changing the script, not giving up."}, {"pain": "Client scared because of war/news", "synonyms": ["war", "geopolitical", "news fear", "safety", "scared buyer", "conflict", "iran"], "book": "War-Time Dubai Realtor Structure (2.0)", "page": 12, "fix": "Empathy, fact and context, reframe risk, clear options, then invite a 10-minute call."}, {"pain": "I'm new, no experience", "synonyms": ["beginner", "new agent", "no experience", "just started", "fresher"], "book": "The Beginner Roadmap", "page": 2, "fix": "You fail without a system, not without talent. Follow the step-by-step roadmap."}, {"pain": "Leads come but don't convert", "synonyms": ["no conversion", "not closing", "low closing rate"], "book": "Dubai Realtor System E-book", "page": 8, "fix": "Build a follow-up machine (6\u20138 follow-ups per lead) and a clear offer."}, {"pain": "I'm burnt out from hustling", "synonyms": ["burnout", "tired", "working 80 hours", "exhausted"], "book": "The 7 Beliefs That Transform Realtor Results", "page": 7, "fix": "Systems make you money; hustle makes you tired. Replace grind with strategy."}, {"pain": "My brand looks like everyone else's", "synonyms": ["personal brand", "positioning", "stand out", "branding"], "book": "The Complete Branding Blueprint for Dubai Realtors (2026)", "page": 3, "fix": "If you look like everyone, you compete with everyone. Choose a sharp niche."}]
;
const BOOKS=[["ghost","The Ghost Protocol"],["follow","Follow-Through Playbook"],["cold","Cold Calling Mastery"],["reset","The Dubai Price Reset"],["war","War-Time Realtor Structure"],["pillars","Million Dirham Weekly System"],["system","Dubai Realtor System"],["brand","Branding Blueprint 2026"],["beginner","The Beginner Roadmap"],["mirror","The Mirror Principle"],["beliefs","The 7 Beliefs"],["b500","The 500 Belief Framework"]];
const PLAY="https://play.google.com/store/apps/details?id=com.realtorone.app";

 if(!st.name)b=`<div class="k">Free account · 20 seconds</div><h2 style="margin-top:6px">Keep reading free</h2><label>Name</label><input id="nm" placeholder="Your name"><div class="err" id="e1"></div><label>Email or phone</label><input id="em" placeholder="you@email.com or +971…"><div class="err" id="e2"></div><button class="btn" style="margin-top:8px" onclick="signup()">Continue free</button>`;
