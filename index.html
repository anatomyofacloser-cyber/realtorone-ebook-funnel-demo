<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RealtorOne · Fix the deal you're losing</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#24231f;--mute:#77716a;--gold:#ad8a55;--gold2:#d2b17b;--sage:#7f9b90;--line:#e9e2d6;--paper:#fffdf9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(120% 60% at 50% 0%,#fbf7f0,#eef2ef);font-family:Inter,sans-serif;color:var(--ink);min-height:100vh}
.wrap{max-width:460px;margin:0 auto;padding:16px 16px 120px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.logo{font-size:11px;letter-spacing:.24em;font-weight:700;color:var(--gold)}
.nav{display:flex;gap:6px}.nb{font-size:12px;font-weight:600;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 11px;cursor:pointer}
.prog{margin:12px 0 18px}.pl{font-size:12px;font-weight:600;color:var(--mute);margin-bottom:6px}.pb{height:4px;background:var(--line);border-radius:9px;overflow:hidden}.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .5s ease}
.scr{animation:in .45s cubic-bezier(.2,.8,.2,1)}@keyframes in{from{opacity:0;transform:translateY(12px)}}
h1{font-family:'Cormorant Garamond',serif;font-size:31px;line-height:1.08;margin:4px 0 8px}h2{font-family:'Cormorant Garamond',serif;font-size:24px;margin:0 0 6px;line-height:1.15}
.mute{color:var(--mute);font-size:14px;line-height:1.5}.k{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--sage);text-transform:uppercase}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 10px 30px rgba(110,90,60,.07)}
.post{cursor:pointer;transition:transform .2s,box-shadow .2s}.post:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(110,90,60,.12)}
.ph{display:flex;gap:10px;align-items:center}.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--sage));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.hook{font-weight:600;font-size:15.5px;margin:10px 0 0;line-height:1.4}
.q{border-left:3px solid var(--gold);background:#faf5ec;padding:11px 13px;border-radius:0 12px 12px 0;font-family:'Cormorant Garamond',serif;font-size:18.5px;line-height:1.35;margin:10px 0 6px}
.src{font-size:12px;color:var(--mute)}.cta-l{color:#2f7385;font-weight:700;font-size:14px;margin-top:8px}
.re{display:flex;gap:14px;font-size:12.5px;color:var(--mute);margin-top:10px;padding-top:9px;border-top:1px solid var(--line);flex-wrap:wrap}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px;margin:8px 0;font-size:15px;font-family:inherit;cursor:pointer;transition:.2s}.opt:hover{border-color:var(--gold)}.opt.on{border-color:var(--gold);background:#fbf6ec;box-shadow:0 0 0 3px rgba(173,138,85,.15)}
.res{background:linear-gradient(135deg,#f3eee4,#eaf1ee);border-radius:20px;padding:18px;margin-top:12px;animation:in .5s}
.page{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#fff}.page img{width:100%;display:block}
.page .bl{position:absolute;left:0;right:0;bottom:0;top:38%;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);background:linear-gradient(180deg,rgba(255,253,249,.25),rgba(250,245,236,.96) 55%)}
.line{background:#fff;border:1.5px dashed var(--gold);border-radius:16px;padding:14px;font-size:15.5px;line-height:1.45}
.copy{margin-top:10px;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:10px 14px;font-weight:600;cursor:pointer;font-family:inherit}
ul.lk{list-style:none;padding:0;margin:8px 0}ul.lk li{padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px;display:flex;gap:8px}ul.lk li:before{content:"🔒"}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.07em;padding:4px 9px;border-radius:999px;background:#eef3f1;color:#4b6b60}
.flag{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:6px;background:#fff4dc;color:#8a6420;margin-left:4px}
.cd{display:flex;gap:6px;margin:10px 0}.cd div{flex:1;text-align:center;background:#faf5ec;border-radius:12px;padding:8px 0}.cd b{display:block;font-family:'Cormorant Garamond',serif;font-size:24px}.cd span{font-size:10px;color:var(--mute);font-weight:600}
.seat{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0}.seat i{display:block;height:100%;width:63%;background:linear-gradient(90deg,var(--sage),var(--gold))}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.plan{position:relative;border:1.5px solid var(--line);border-radius:16px;padding:14px 12px;cursor:pointer;background:#fff}.plan.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(173,138,85,.15)}
.pr{font-family:'Cormorant Garamond',serif;font-size:23px;font-weight:700;margin:4px 0 0}.badge{position:absolute;top:-10px;left:10px;background:var(--gold);color:#fff;font-size:9.5px;font-weight:700;padding:3px 8px;border-radius:999px;letter-spacing:.05em}.save{color:#4b6b60;font-size:12px;font-weight:700}
.vs{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px}.vs td{padding:7px 0;border-bottom:1px solid var(--line)}.vs td:last-child{text-align:right;color:var(--mute)}
.strike{text-decoration:line-through;color:var(--mute)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.tab{border:1px solid var(--line);border-radius:999px;padding:7px 11px;font-size:12.5px;cursor:pointer;background:var(--paper)}.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.empty{border:1.5px dashed #d8cdb9;border-radius:16px;padding:16px;text-align:center;color:var(--mute);font-size:13.5px}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:15px;font-family:inherit;background:var(--paper)}.err{color:#b4533d;font-size:12px;min-height:14px}
.ok{width:64px;height:64px;border-radius:50%;background:#e9f1ed;color:#4b6b60;font-size:30px;display:flex;align-items:center;justify-content:center;margin:4px auto 8px;animation:pop .5s}@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.1)}}
.c{text-align:center}.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.bk{text-align:center;font-size:11px;line-height:1.3;color:var(--mute)}.bk img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:top;border-radius:8px;border:1px solid var(--line);box-shadow:0 6px 14px rgba(0,0,0,.08);margin-bottom:5px;background:#fff}
.sticky{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(246,243,238,0),rgba(246,243,238,.96) 30%);z-index:5}
.sticky .in{max-width:428px;margin:0 auto}
.btn{display:block;width:100%;border:0;border-radius:999px;padding:15px;font-size:15.5px;font-weight:700;cursor:pointer;font-family:inherit;color:#fff;background:linear-gradient(135deg,var(--gold),var(--gold2));box-shadow:0 10px 24px rgba(173,138,85,.35);transition:transform .15s}.btn:active{transform:scale(.98)}.btn:disabled{opacity:.45;box-shadow:none}
.btn.dark{background:var(--ink);box-shadow:0 10px 24px rgba(0,0,0,.18)}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;z-index:9;animation:in .3s}
.note{font-size:11px;color:var(--mute);text-align:center;margin-top:8px}
</style></head><body><div class="wrap" id="app"></div><div class="sticky" id="st"></div>
<script>
const PAINS={
ghost:{book:"The Ghost Protocol",page:8,img:"pages/ghost-8.jpg",name:"RealtorOne Community",hook:"Buyer loved the viewing… then went silent?",quote:"When a buyer leaves a viewing with more data than direction, their brain defaults to 'I need to think about it.'",free:"REASON 01 — INFORMATION OVERLOAD. When a buyer leaves a viewing with more data than direction, their brain defaults to 'I need to think about it.' You showed them square footage, payment plan breakdowns, handover dates, ROI projections, and community facilities. But you never helped them simplify. Overloaded buyers postpone decisions. And postponed decisions become ghosting.",line:"What made you start looking now, specifically?",lineSrc:"The Ghost Protocol · p12 · ask this in your discovery call before the next viewing",locked:["Reason 02 — Emotional disconnection","Reason 03 — No urgency created","Reason 04 — Weak agent authority","Reason 05 — Fear of regret","Reasons 06–08 + the V.I.E.W. Framework to stop ghosting"],stage:"after the viewing",stat:"The book's own finding: a buyer who leaves with a specific next step is seven times less likely to disappear (p11)."},
reset:{book:"The Dubai Price Reset · Objection Framework",page:6,img:"pages/reset-6.jpg",name:"RealtorOne Community",hook:"\"Let me think about it\"… and then nothing?",quote:"Never accept \"let me think\" at face value and walk away. It is not a real objection — it is a polite exit.",free:"WHAT THE CLIENT IS REALLY SAYING: \"I'm afraid of making a decision. Give me permission to delay.\" A · ACKNOWLEDGE: \"Of course — this isn't a small decision and I'd be worried if you weren't taking it seriously.\"",line:"So let's do this differently. Tell me the one specific thing you want to think about, and let's resolve it on this call. Is it the developer, the payment plan, or the unit itself?",lineSrc:"Dubai Price Reset · p6 · the C · CLOSE line",locked:["L · Lead with fact: the number they can't dispute","C · Contrast: why thinking is free but waiting isn't","Objection 03 — \"What if the market crashes?\"","Objection 04 — \"Maybe next year\"","The ALCC Method in full (four moves, every call)"],stage:"at the decision moment",stat:""},
cold:{book:"Dubai Cold Calling Mastery",page:33,img:"pages/cold-33.jpg",name:"RealtorOne Community",hook:"\"I'm not interested\" in the first 5 seconds?",quote:"Wrong response: \"Just hear me out for two minutes...\" (pleading, pushes them away)",free:"Objection #1: \"I'm not interested\". Wrong response: \"Just hear me out for two minutes...\" (pleading, pushes them away). Right response: \"I totally understand. Most people aren't interested until they understand the specific advantage. Can I ask you one quick question?\"",line:"I totally understand. Most people aren't interested until they understand the specific advantage. Can I ask you one quick question?",lineSrc:"Dubai Cold Calling Mastery · p33 · then ask: \"Are you currently renting, or do you own your place?\"",locked:["Objection #2 — \"I don't have time for this right now\"","Objection #3 — \"I want to think about it\"","Objection #4 — \"The price is too high\"","Objection #5 — \"I know someone who can sell it cheaper\"","5 full call scripts + WhatsApp follow-up sequences"],stage:"in the first seconds of the call",stat:""},
follow:{book:"The Follow-Through Playbook",page:25,img:"pages/follow-25.jpg",name:"RealtorOne Community",hook:"\"I need to speak to my partner\"… and the deal stalls?",quote:"\"I need to speak to my partner.\" → the invisible question: \"How do I explain this confidently?\"",free:"Silence, decoded. They said: \"I need to speak to my partner.\" The invisible question: \"How do I explain this confidently?\" Your move: Arm them with a one-page summary they can share. Make them look smart.",line:"Can I ask you something direct, [Name]? What specific information is missing for you to feel 100% confident moving forward?",lineSrc:"The Follow-Through Playbook · p15 · The Magic Question",locked:["\"Send me some options.\" — what it really means","Goes silent after a viewing — your move","\"The price feels high.\" — your move","\"I'll wait for the market.\" — your move","Ghosts completely — the re-engagement voice note"],stage:"when the decision moves to the family",stat:""}};
const ORDER=["ghost","reset","cold","follow"];
const BOOKS=[["ghost","The Ghost Protocol"],["follow","The Follow-Through Playbook"],["cold","Dubai Cold Calling Mastery"],["reset","The Dubai Price Reset"],["war","War-Time Dubai Realtor Structure"],["pillars","Million Dirham Weekly System"],["system","Dubai Realtor System"],["brand","Branding Blueprint 2026"],["beginner","The Beginner Roadmap"],["mirror","The Mirror Principle"],["beliefs","The 7 Beliefs"],["b500","The 500 Belief Framework"]];
const P=new URLSearchParams(location.search);
let st={s:+(P.get('s')||1),pain:P.get('pain')||'ghost',q1:P.get('q1')||'',q2:P.get('q2')||'',path:P.get('path')||'',plan:'q',tab:'lab',name:''};
const NAMES={1:'Community feed',2:'Pain check',3:'Your fix',4:'Choose your option',5:()=>st.path=='b'?(st.paid?'Welcome':'Checkout'):(st.reg?'You\'re in':'Register free')};
const $=id=>document.getElementById(id);
function go(n){st.s=n;render();scrollTo({top:0,behavior:'smooth'})}
function restart(){st={...st,s:1,q1:'',q2:'',path:'',name:'',reg:0,paid:0};render();scrollTo(0,0)}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
function head(){const n=typeof NAMES[st.s]=='function'?NAMES[st.s]():NAMES[st.s];return `<div class="top"><span class="logo">REALTOR ONE</span><span class="nav">${st.s>1?`<span class="nb" onclick="go(${st.s-1})">← Back</span><span class="nb" onclick="restart()">↺ Restart</span>`:''}</span></div><div class="prog"><div class="pl">Step ${st.s} of 5 · ${n}</div><div class="pb"><i style="width:${st.s*20}%"></i></div></div>`}
function feed(){return `<div class="k">Today in the community</div><h1>Which one hurts most this week?</h1><p class="mute">Tap the one you're facing. Each fix comes from a RealtorOne ebook, word for word.</p>`+
ORDER.map((k,i)=>{const p=PAINS[k];return `<div class="card post" onclick="st.pain='${k}';go(2)"><div class="ph"><div class="av">R1</div><div><b style="font-size:14px">${p.name}</b><div class="src">${['9:30 AM','10:15 AM','11:02 AM','12:40 PM'][i]} · from ${p.book}</div></div></div><div class="hook">${p.hook}</div><div class="q">“${p.quote}”</div><div class="src">${p.book} · Page ${p.page}</div><div class="cta-l">👉 This is me. Show me the fix</div></div>`}).join('')+`<p class="note">Sample community posts for the demo; quotes are real.</p>`}
function quiz(){const p=PAINS[st.pain];const o=(q,v,t)=>`<button class="opt ${st[q]==v?'on':''}" onclick="st.${q}='${v}';render()">${t}</button>`;
 let h=`<div class="k">Pain check · 2 taps</div><h1>${p.hook}</h1><div class="card"><b>1. How often does this happen to you?</b>${o('q1','w','Every week')}${o('q1','m','A few times a month')}${o('q1','r','Once in a while')}</div>`;
 if(st.q1)h+=`<div class="card scr"><b>2. What does it cost you most?</b>${o('q2','c','A commission I was counting on')}${o('q2','t','Hours of chasing and follow-up')}${o('q2','f','My confidence on the next call')}</div>`;
 if(st.q1&&st.q2){const freq={w:'every week',m:'a few times a month',r:'now and then'}[st.q1];const cost={c:'commissions',t:'hours',f:'confidence'}[st.q2];
  h+=`<div class="res"><div class="k">Your result</div><h2>You may be losing deals ${p.stage}.</h2><p class="mute" style="margin:0">It happens ${freq}, and it's costing you ${cost}. The good news: there's an exact fix on page ${p.page} of ${p.book}.</p>${p.stat?`<p class="mute" style="margin:8px 0 0">📖 ${p.stat}</p>`:''}</div>`}
 return h}
function fix(){const p=PAINS[st.pain];return `<div class="k">${p.book} · Page ${p.page}</div><h1>Your first fix, free</h1><div class="card"><div class="q" style="margin-top:0">“${p.free}”</div><div class="src">Verbatim from ${p.book}, page ${p.page}</div></div>
<div class="card"><div class="k">⚡ Try this line today</div><div class="line" id="ln" style="margin-top:8px">${p.line}</div><div class="src" style="margin-top:6px">${p.lineSrc}</div><button class="copy" onclick="navigator.clipboard&&navigator.clipboard.writeText($('ln').textContent).catch(()=>{});toast('Copied. Use it on your next call ✓')">📋 Copy this line</button></div>
<div class="page"><img src="${p.img}" alt="${p.book} page ${p.page}"><div class="bl"></div></div>
<div class="card"><h2>Want the full step-by-step?</h2><p class="mute" style="margin:0">Still locked on this page and in the book:</p><ul class="lk">${p.locked.map(x=>`<li>${x}</li>`).join('')}</ul></div>`}
function countdown(){const n=new Date();const d=new Date(n);d.setDate(n.getDate()+((4-n.getDay()+7)%7||7));d.setHours(19,0,0,0);let s=Math.max(0,(d-n)/1000);return [Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60)]}
function labDate(){const n=new Date();const d=new Date(n);d.setDate(n.getDate()+((4-n.getDay()+7)%7||7));return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}
const BEN={lab:["Weekly Thursday Live Lab with Mr Aanant","Replay library of past Labs","Bring your live deal, get the script"],ebooks:["All 12 RealtorOne ebooks","Ebook Finder: type a pain, get the page","New ebooks as they launch"],courses:["Cold Calling Mastery","Invisible Influence","Million Dirham Beliefs"],daily:["Daily Affirmation","Daily Visualization","5-minute calm morning routine"],crm:["RealtorOne CRM","Track leads, calls, follow-ups","Weekly pipeline view"]};
const TN={lab:"Live Lab",ebooks:"Ebooks",courses:"Courses",daily:"Daily mind",crm:"CRM"};
function offer(){const p=PAINS[st.pain];const [D,H,M]=countdown();return `<div class="k">Unlock the full fix</div><h1>Two ways in. Pick yours.</h1>
<div class="card"><span class="tag">OPTION 1 · FREE</span><h2 style="margin-top:8px">Free first Live Lab + this ebook</h2><p class="mute" style="margin:0">Join this Thursday's Live Lab free, and get <b>${p.book}</b> free in your inbox.</p>
<div class="cd"><div><b>${D}</b><span>DAYS</span></div><div><b>${H}</b><span>HRS</span></div><div><b>${M}</b><span>MIN</span></div></div><div class="src">Next Lab: ${labDate()} · 7:00 PM GST <span class="flag">CONFIRM TIME</span></div>
<div style="display:flex;justify-content:space-between;font-size:13px;margin-top:10px"><b>37 seats left</b><span class="mute">of 100 <span class="flag">DEMO NUMBER</span></span></div><div class="seat"><i></i></div>
<button class="btn dark" style="margin-top:12px" onclick="st.path='a';go(5)">Choose Option 1: Save my free seat</button></div>
<div class="card"><span class="tag">OPTION 2 · FULL MEMBERSHIP</span><h2 style="margin-top:8px">Everything, every week</h2>
<div class="plans"><div class="plan ${st.plan=='m'?'on':''}" onclick="st.plan='m';render()"><div class="src">Monthly</div><div class="pr">AED 392.80</div><div class="src">per month</div></div><div class="plan ${st.plan=='q'?'on':''}" onclick="st.plan='q';render()"><span class="badge">MOST POPULAR</span><div class="src">3 months</div><div class="pr">AED 995.80</div><div class="save">Save AED 182.60</div></div></div>
<div class="tabs">${Object.keys(TN).map(k=>`<span class="tab ${k==st.tab?'on':''}" onclick="st.tab='${k}';render()">${TN[k]}</span>`).join('')}</div><ul style="margin:0;padding-left:18px;font-size:14px;line-height:1.8">${BEN[st.tab].map(x=>`<li>${x}</li>`).join('')}</ul>
<div style="margin-top:12px"><b style="font-size:14px">What's included</b> <span class="flag">EXAMPLE VALUES, CONFIRM</span><table class="vs"><tr><td>Weekly Live Labs + replays</td><td>AED 1,200</td></tr><tr><td>All 12 ebooks + Ebook Finder</td><td>AED 600</td></tr><tr><td>3 courses</td><td>AED 1,500</td></tr><tr><td>Daily Affirmation & Visualization</td><td>AED 300</td></tr><tr><td>RealtorOne CRM</td><td>AED 400</td></tr><tr><td><b>Total example value</b></td><td><span class="strike">AED 4,000</span></td></tr></table></div>
<div style="margin-top:10px;font-size:13.5px">🎁 <b>Bonuses:</b> Ebook Finder search · 15-Objections ebook</div>
<div style="margin-top:8px;font-size:13.5px">🛡️ [Risk reversal: e.g. "7-day money-back guarantee"] <span class="flag">PLACEHOLDER, CONFIRM</span></div>
<button class="btn" style="margin-top:12px" onclick="st.path='b';go(5)">Choose Option 2: ${st.plan=='q'?'AED 995.80 / 3 months':'AED 392.80 / month'}</button></div>
<div class="card"><div class="k">Member results</div><div class="empty" style="margin-top:8px">Your members' results here<br><span style="font-size:12px">(add real quotes with name, role and result)</span></div></div>`}
function shelf(){return `<div class="shelf">${BOOKS.map(([k,t])=>`<div class="bk"><img src="covers/${k}.jpg" alt="${t}">${t}</div>`).join('')}</div>`}
function done(){const p=PAINS[st.pain];
 if(st.path=='a'){if(!st.reg)return `<div class="k">Option 1 · Free first Live Lab</div><h1>Save your free seat</h1><div class="card"><label>Full name *</label><input id="nm" placeholder="Your name"><div class="err" id="e1"></div><label>Email *</label><input id="em" type="email" placeholder="you@email.com"><div class="err" id="e2"></div><label>WhatsApp (optional)</label><input id="wa" placeholder="+971 5X XXX XXXX"><p class="note">We'll email the ebook and your Lab link.</p></div>`;
  return `<div class="c"><div class="ok">✓</div><h1>You're in${st.name?', '+st.name.split(' ')[0]:''}!</h1><p class="mute">${p.book} is on its way to your inbox, and your seat is saved for ${labDate()}.</p></div>
<div class="card" style="background:linear-gradient(135deg,#fbf6ec,#eef3f0)"><span class="tag">UPGRADE</span><h2 style="margin-top:8px">Upgrade today and keep all 12 ebooks</h2><p class="mute" style="margin:0 0 10px">Plus every Live Lab, replays, 3 courses, daily mind training and the CRM.</p>${shelf()}<button class="btn" style="margin-top:14px" onclick="st.path='b';st.reg=0;render()">Upgrade: AED 995.80 / 3 months</button><button class="btn ghost" style="margin-top:8px" onclick="toast('No problem. See you Thursday!')">Maybe later</button></div>`}
